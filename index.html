<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QuickShare</title>
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.0.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --bg: #07111f;
      --bg-2: #0b1728;
      --panel: rgba(17, 25, 38, 0.82);
      --panel-strong: rgba(20, 31, 46, 0.96);
      --panel-soft: rgba(26, 39, 56, 0.8);
      --line: rgba(148, 163, 184, 0.18);
      --text: #edf5ff;
      --muted: #9fb6d1;
      --dim: #6f8cb6;
      --primary: #7c5cff;
      --primary-2: #4cc9f0;
      --success: #2fd38b;
      --danger: #ff5f6d;
      --warning: #ffb84d;
      --shadow: 0 22px 60px rgba(3, 10, 20, 0.6);
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(124, 92, 255, 0.26), transparent 32%),
        radial-gradient(circle at top right, rgba(76, 201, 240, 0.2), transparent 28%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 18px;
      overflow-x: hidden;
    }

    .app {
      width: min(100%, 760px);
      background: rgba(8, 13, 22, 0.7);
      border: 1px solid var(--line);
      border-radius: 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      position: relative;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.12), transparent 36%, rgba(76, 201, 240, 0.08));
      pointer-events: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 6px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      box-shadow: 0 12px 24px rgba(124, 92, 255, 0.35);
      padding: 8px;
    }

    .brand-mark svg {
      width: 100%;
      height: 100%;
      fill: white;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .status-pill {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(47, 211, 139, 0.25);
      background: rgba(47, 211, 139, 0.1);
      color: #b9f7d6;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-pill.disconnected {
      border-color: rgba(255, 95, 109, 0.25);
      background: rgba(255, 95, 109, 0.08);
      color: #ffc8cf;
    }

    .device-card,
    .panel,
    .incoming-box,
    .qr-panel,
    .camera-panel {
      background: linear-gradient(180deg, rgba(17, 25, 38, 0.95), rgba(15, 22, 32, 0.85));
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .device-card {
      padding: 18px 18px 16px;
      position: relative;
      overflow: hidden;
    }

    .device-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124, 92, 255, 0.9), transparent);
      opacity: 0.8;
    }

    .device-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .section-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .device-id {
      border: 1px solid rgba(76, 201, 240, 0.2);
      background: rgba(12, 17, 25, 0.9);
      color: var(--primary-2);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      user-select: all;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .device-id:active {
      transform: scale(0.98);
      border-color: rgba(76, 201, 240, 0.42);
    }

    .device-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .device-avatar {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(124,92,255,0.22), rgba(76,201,240,0.18));
      border: 1px solid rgba(124, 92, 255, 0.35);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      padding: 12px;
    }

    .device-avatar svg {
      width: 100%;
      height: 100%;
      fill: var(--text);
    }

    .device-name {
      font-size: clamp(1.1rem, 2vw, 1.52rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      word-break: break-word;
    }

    .connect-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
    }

    .connect-row input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(9, 14, 22, 0.9);
      color: var(--text);
      font-size: 0.96rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .connect-row input:focus {
      border-color: rgba(124, 92, 255, 0.6);
      box-shadow: 0 0 0 4px rgba(124,92,255,0.12);
    }

    .connect-tools {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .qr-panel {
      margin-top: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(9, 14, 22, 0.8);
    }

    .qr-panel img {
      width: min(100%, 220px);
      height: auto;
      display: block;
      border-radius: 18px;
      background: white;
      padding: 10px;
    }

    .camera-panel {
      margin-top: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(9, 14, 22, 0.8);
    }

    .camera-stage {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      width: 100%;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-stage video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .scan-guides {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(transparent 60%, rgba(76, 201, 240, 0.28) 60% 70%, transparent 100%);
      opacity: 0.9;
    }

    .scan-guides::before,
    .scan-guides::after {
      content: "";
      position: absolute;
      width: 52px;
      height: 52px;
      border: 3px solid rgba(76, 201, 240, 0.9);
      border-radius: 14px;
      top: 26%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 18px rgba(76, 201, 240, 0.25);
    }

    .scan-guides::after {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-weight: 700;
      font-size: 0.94rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      color: var(--text);
      user-select: none;
      transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn:hover {
      filter: brightness(1.06);
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--primary) 0%, #9a7bff 100%);
      box-shadow: 0 12px 25px rgba(124, 92, 255, 0.28);
    }

    .btn.secondary {
      background: linear-gradient(135deg, var(--primary-2) 0%, #7bdff7 100%);
      box-shadow: 0 12px 25px rgba(76, 201, 240, 0.22);
      color: #07131d;
    }

    .btn.success {
      background: linear-gradient(135deg, #2fd38b 0%, #58e0a1 100%);
      color: #072111;
      box-shadow: 0 12px 25px rgba(47, 211, 139, 0.2);
    }

    .btn.danger {
      background: linear-gradient(135deg, #ff6b7a 0%, #ff8b9c 100%);
      color: #fff;
      box-shadow: 0 12px 25px rgba(255, 95, 109, 0.2);
    }

    .btn.ghost {
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(18, 26, 37, 0.8);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .btn svg,
    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      fill: currentColor;
      flex-shrink: 0;
    }

    .incoming-box {
      margin-top: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .incoming-box .msg {
      font-size: 0.96rem;
      color: var(--text);
      line-height: 1.4;
    }

    .incoming-box .actions {
      display: flex;
      gap: 10px;
      margin: 0;
      flex-wrap: wrap;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      color: var(--muted);
      margin: 18px 0 14px;
      padding: 0 4px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 6px rgba(47, 211, 139, 0.08);
      animation: pulse 1.5s infinite ease-in-out;
    }

    .status-bar.disconnected .status-dot {
      background: var(--danger);
      box-shadow: none;
      animation: none;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 6px;
      background: rgba(12, 18, 27, 0.88);
      border: 1px solid var(--line);
      border-radius: 18px;
      margin-bottom: 14px;
    }

    .tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 12px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
      text-transform: uppercase;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: white;
      box-shadow: 0 10px 20px rgba(124, 92, 255, 0.2);
    }

    .panel {
      padding: 12px;
      min-height: 200px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 6px 0;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 12px;
    }

    .file-list {
      background: rgba(9, 14, 22, 0.75);
      border: 1px solid var(--line);
      border-radius: 18px;
      min-height: 120px;
      max-height: 300px;
      overflow-y: auto;
      padding: 0 10px;
    }

    .file-list.empty {
      display: grid;
      place-items: center;
      color: var(--muted);
      min-height: 110px;
      text-align: center;
      padding: 24px 18px;
      font-size: 0.9rem;
    }

    .file-item, .received-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .file-item:last-child, .received-item:last-child {
      border-bottom: none;
    }

    .file-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .file-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(124, 92, 255, 0.12);
      border: 1px solid rgba(124, 92, 255, 0.18);
      display: grid;
      place-items: center;
      color: var(--primary-2);
      flex-shrink: 0;
      padding: 7px;
    }

    .file-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .file-info {
      min-width: 0;
      flex: 1;
    }

    .file-name {
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
      line-height: 1.3;
    }

    .file-size {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      margin-top: 2px;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 1.4rem;
      line-height: 1;
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.18s ease;
    }

    .remove-btn:hover {
      background: rgba(255, 95, 109, 0.08);
    }

    .copy-text {
      color: var(--primary-2);
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      border: 1px solid rgba(76, 201, 240, 0.2);
      background: rgba(76, 201, 240, 0.05);
      padding: 6px 8px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .status-text {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 0 4px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .status-text.hidden,
    .hidden {
      display: none !important;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
      }

      .shell {
        padding: 14px;
      }

      .topbar {
        align-items: flex-start;
      }

      .status-pill {
        font-size: 0.65rem;
      }

      .connect-row {
        flex-direction: column;
      }

      .connect-row .btn {
        width: 100%;
      }

      .device-card {
        padding: 16px 14px 14px;
      }

      .device-header,
      .device-meta,
      .incoming-box {
        align-items: flex-start;
      }

      .device-id {
        width: 100%;
      }

      .file-item, .received-item {
        align-items: flex-start;
      }

      .actions-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .actions-row .btn {
        width: 100%;
      }

      .connect-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-label="QuickShare logo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a1.5 1.5 0 0 1 1.5 1.5v6.2l1.5-1.5a1.5 1.5 0 1 1 2.12 2.12l-4.24 4.24a1.5 1.5 0 0 1-2.12 0l-4.24-4.24A1.5 1.5 0 0 1 8.5 10.7l1.5 1.5V4A1.5 1.5 0 0 1 12 2.5zm-7 9.5a1.5 1.5 0 0 1 1.5 1.5v3.5A2.5 2.5 0 0 0 9 19.5h6a2.5 2.5 0 0 0 2.5-2.5v-3.5a1.5 1.5 0 1 1 3 0v3.5A5.5 5.5 0 0 1 15 21.5H9A5.5 5.5 0 0 1 3.5 16v-3.5a1.5 1.5 0 0 1 1.5-1.5z"/></svg>
        </div>
        <div class="brand-copy">
          <div class="brand-title">QuickShare</div>
          <div class="brand-sub">Secure peer transfer</div>
        </div>
      </div>
      <div id="connectionPill" class="status-pill disconnected">Offline</div>
    </div>

    <div class="device-card">
      <div class="device-header">
        <div class="section-label">Your device</div>
        <div class="device-id" id="deviceIdDisplay" title="Tap to copy">-</div>
      </div>

      <div class="device-meta">
        <div class="device-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 2.75A2.75 2.75 0 0 0 4.25 5.5v13A2.75 2.75 0 0 0 7 21.25h10A2.75 2.75 0 0 0 19.75 18.5v-13A2.75 2.75 0 0 0 17 2.75H7zm0 1.5h10A1.25 1.25 0 0 1 18.25 5.5v13A1.25 1.25 0 0 1 17 19.75H7A1.25 1.25 0 0 1 5.75 18.5v-13A1.25 1.25 0 0 1 7 4.25zm4.5 9.75h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1 0-1.5zm0-3.5h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1 0-1.5zm-1.25-3h5.5a.75.75 0 0 1 0 1.5h-5.5a.75.75 0 0 1 0-1.5z"/></svg>
        </div>
        <div class="device-name" id="deviceName">QuickShare Device</div>
      </div>

      <div class="connect-row">
        <input type="text" id="remoteIdInput" placeholder="Enter peer ID" autocomplete="off">
        <button class="btn secondary" id="connectBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8.5A3.5 3.5 0 1 1 9 15.5a3.5 3.5 0 0 1 0-7zm6 0A3.5 3.5 0 1 1 15 15.5a3.5 3.5 0 0 1 0-7zm-6 1.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7.5 8a3.5 3.5 0 0 1 3.5-3.5h3a3.5 3.5 0 0 1 3.5 3.5v.5a.75.75 0 0 1-1.5 0v-.5a2 2 0 0 0-2-2h-3a2 2 0 0 0-2 2v.5a.75.75 0 0 1-1.5 0v-.5z"/></svg>
          Connect
        </button>
      </div>

      <div class="connect-tools">
        <button class="btn ghost" id="showQrBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3.75A.75.75 0 0 1 3.75 3h3.5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-.75.75h-3.5A.75.75 0 0 1 3 7.25v-3.5zm1.5 1.5v2h2v-2h-2zm12-1.5a.75.75 0 0 1 .75-.75h3.5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-.75.75h-3.5a.75.75 0 0 1-.75-.75v-3.5zm1.5 1.5v2h2v-2h-2zm-13.5 9a.75.75 0 0 1 .75-.75h3.5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-.75.75h-3.5A.75.75 0 0 1 3 17.25v-3.5zm1.5 1.5v2h2v-2h-2zm9-1.5a.75.75 0 0 1 .75-.75h3.5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-.75.75h-3.5a.75.75 0 0 1-.75-.75v-3.5zm1.5 1.5v2h2v-2h-2zm-5.25-6a.75.75 0 0 1 .75-.75h.75V7.5h1.5v1.5h.75a.75.75 0 0 1 .75.75v.75h1.5V9.75h1.5v1.5h-1.5v.75a.75.75 0 0 1-.75.75h-.75v1.5h-1.5v-1.5h-.75A.75.75 0 0 1 9 12.75v-.75H7.5v-1.5h1.5v1.5h1.5v-.75A.75.75 0 0 1 10.5 9.75zm0 0h.75v.75h-.75v-.75zm6.75 0h.75v.75h-.75v-.75z"/></svg>
          Show QR
        </button>
        <button class="btn ghost" id="scanQrBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.75 7.5A2.75 2.75 0 0 1 5.5 4.75h3.25a.75.75 0 0 1 0 1.5H5.5A1.25 1.25 0 0 0 4.25 7.5v3.25a.75.75 0 0 1-1.5 0V7.5zm15.75-2.75h3.25A2.75 2.75 0 0 1 24 7.5v3.25a.75.75 0 0 1-1.5 0V7.5A1.25 1.25 0 0 0 21.25 6.25H18a.75.75 0 0 1 0-1.5zm-1.5 13.5h3.25A1.25 1.25 0 0 0 21.25 17v-3.25a.75.75 0 0 1 1.5 0V17A2.75 2.75 0 0 1 20 19.75h-3.25a.75.75 0 0 1 0-1.5zm-15.75-2.75a.75.75 0 0 1 .75-.75h3.25a.75.75 0 0 1 0 1.5H5.5A1.25 1.25 0 0 0 4.25 17V20.25a.75.75 0 0 1-1.5 0V17zm10.5-8.75h-3.5a.75.75 0 0 1 0-1.5h3.5a.75.75 0 0 1 0 1.5zm-3.5 12.5h3.5a.75.75 0 0 1 0 1.5h-3.5a.75.75 0 0 1 0-1.5zm-4-5.5h1.5v1.5h-1.5v-1.5zm8.5-1.5h1.5v4h-1.5v-4zm-1.5-1.5h4v1.5h-4v-1.5zm-5.5 7h1.5v1.5h-1.5v-1.5zm7-3.5h1.5v1.5h-1.5v-1.5z"/></svg>
          Scan QR
        </button>
      </div>

      <div id="qrPanel" class="qr-panel hidden">
        <img id="qrImage" alt="Peer QR connection code" />
      </div>

      <div id="cameraPanel" class="camera-panel hidden">
        <div class="camera-stage">
          <video id="qrVideo" autoplay playsinline muted></video>
          <div class="scan-guides"></div>
        </div>
        <button class="btn danger" id="closeCameraBtn">Close camera</button>
      </div>
    </div>

    <div id="incomingRequest" class="incoming-box hidden">
      <div class="msg"><strong id="incomingPeerName">Unknown device</strong> wants to connect</div>
      <div class="actions">
        <button class="btn success" id="acceptBtn">Accept</button>
        <button class="btn danger" id="denyBtn">Deny</button>
      </div>
    </div>

    <div id="connectionStatus" class="status-bar disconnected">
      <span class="status-dot"></span>
      <span>Waiting to connect...</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="send">Send</button>
      <button class="tab" data-tab="receive">Receive</button>
    </div>

    <div id="sendPanel" class="panel">
      <div class="panel-header">
        <span>File transfer</span>
      </div>

      <div class="actions-row">
        <button class="btn primary" id="selectFilesBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.75A2.75 2.75 0 0 1 7.75 2h3.46a2.75 2.75 0 0 1 2.34 1.2l.47.8h2.18A2.75 2.75 0 0 1 19 6.75v12.5A2.75 2.75 0 0 1 16.25 22H7.75A2.75 2.75 0 0 1 5 19.25V4.75zm2.75-.75a1.25 1.25 0 0 0-1.25 1.25v14.5c0 .69.56 1.25 1.25 1.25h8.5c.69 0 1.25-.56 1.25-1.25V6.75a1.25 1.25 0 0 0-1.25-1.25h-2.18a1.75 1.75 0 0 1-1.5-.8l-.42-.72A1.25 1.25 0 0 0 11.21 4H7.75z"/></svg>
          Select Files
        </button>
        <button class="btn primary" id="sendTextBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5A2.5 2.5 0 0 0 3.5 6v12A2.5 2.5 0 0 0 6 20.5h12A2.5 2.5 0 0 0 20.5 18V6A2.5 2.5 0 0 0 18 3.5H6zm0 1.5h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 3.5a.75.75 0 0 1 0-1.5h8a.75.75 0 0 1 0 1.5H8zm0 4a.75.75 0 0 1 0-1.5h8a.75.75 0 0 1 0 1.5H8zm0 4a.75.75 0 0 1 0-1.5h5a.75.75 0 0 1 0 1.5H8z"/></svg>
          Send Text
        </button>
      </div>

      <div id="sendFileList" class="file-list empty">No files selected</div>

      <div id="sendFooter" class="actions-row hidden" style="margin-top: 10px;">
        <button class="btn secondary" id="sendFilesBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.75a.75.75 0 0 1 .75.75v9.19l2.72-2.72a.75.75 0 0 1 1.06 1.06l-4 4a.75.75 0 0 1-1.06 0l-4-4a.75.75 0 1 1 1.06-1.06l2.72 2.72V3.5a.75.75 0 0 1 .75-.75zm-7.25 13a.75.75 0 0 1 .75.75V18A1.75 1.75 0 0 0 7.25 19.75h9.5A1.75 1.75 0 0 0 18.5 18v-1.5a.75.75 0 0 1 1.5 0V18A3.25 3.25 0 0 1 16.75 21.25h-9.5A3.25 3.25 0 0 1 4 18v-1.5a.75.75 0 0 1 .75-.75z"/></svg>
          Send Files
        </button>
      </div>

      <div id="sendProgress" class="status-text hidden"></div>
    </div>

    <div id="receivePanel" class="panel hidden">
      <div class="panel-header">
        <span>Incoming</span>
      </div>
      <div id="receiveList" class="file-list empty">No items received yet</div>
      <div id="receiveStatus" class="status-text hidden"></div>
    </div>

    <div class="actions-row hidden" id="disconnectContainer" style="margin-top: 14px;">
      <button class="btn danger" id="disconnectBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.75 5.25A1.75 1.75 0 0 0 5 7v10a1.75 1.75 0 0 0 1.75 1.75h.75a.75.75 0 0 1 0 1.5h-.75A3.25 3.25 0 0 1 3.5 17V7A3.25 3.25 0 0 1 6.75 3.75h.75a.75.75 0 0 1 0 1.5h-.75zm11.28 5.47a.75.75 0 0 1 1.06 0l2.75 2.75a.75.75 0 0 1 0 1.06l-2.75 2.75a.75.75 0 1 1-1.06-1.06l1.72-1.72H9.75a.75.75 0 0 1 0-1.5h9.99l-1.72-1.72a.75.75 0 0 1 0-1.06zM9 8.25a.75.75 0 0 1 0 1.5H6.75A.75.75 0 0 1 6 9v6a.75.75 0 0 1 1.5 0h2.25a.75.75 0 0 1 0 1.5H6A2.25 2.25 0 0 1 3.75 15V9A2.25 2.25 0 0 1 6 6.75H9a.75.75 0 0 1 0 1.5z"/></svg>
        Disconnect
      </button>
    </div>
  </div>
</div>

<script>
  (function () {
    const deviceNameEl = document.getElementById('deviceName');
    const deviceIdEl = document.getElementById('deviceIdDisplay');
    const remoteIdInput = document.getElementById('remoteIdInput');
    const connectBtn = document.getElementById('connectBtn');
    const incomingRequest = document.getElementById('incomingRequest');
    const incomingPeerName = document.getElementById('incomingPeerName');
    const acceptBtn = document.getElementById('acceptBtn');
    const denyBtn = document.getElementById('denyBtn');
    const connectionStatus = document.getElementById('connectionStatus');
    const connectionPill = document.getElementById('connectionPill');
    const tabs = document.querySelectorAll('.tab');
    const sendPanel = document.getElementById('sendPanel');
    const receivePanel = document.getElementById('receivePanel');
    const sendFileList = document.getElementById('sendFileList');
    const sendFooter = document.getElementById('sendFooter');
    const sendFilesBtn = document.getElementById('sendFilesBtn');
    const sendProgress = document.getElementById('sendProgress');
    const selectFilesBtn = document.getElementById('selectFilesBtn');
    const sendTextBtn = document.getElementById('sendTextBtn');
    const receiveList = document.getElementById('receiveList');
    const receiveStatus = document.getElementById('receiveStatus');
    const disconnectContainer = document.getElementById('disconnectContainer');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const qrImage = document.getElementById('qrImage');
    const qrPanel = document.getElementById('qrPanel');
    const showQrBtn = document.getElementById('showQrBtn');
    const scanQrBtn = document.getElementById('scanQrBtn');
    const cameraPanel = document.getElementById('cameraPanel');
    const qrVideo = document.getElementById('qrVideo');
    const qrCanvas = document.createElement('canvas');
    const closeCameraBtn = document.getElementById('closeCameraBtn');

    let peer = null;
    let currentConnection = null;
    let incomingConn = null;
    let selectedFiles = [];
    let receivedItems = [];
    let activeTab = 'send';
    let cameraStream = null;
    let qrScannerTimer = null;

    const SAFE_CHUNK_SIZE = 128 * 1024;
    const MAX_BUFFERED_BYTES = 2 * 1024 * 1024;

    const peerId = 'quickshare-' + Math.random().toString(36).substring(2, 10);
    deviceIdEl.textContent = peerId;
    deviceNameEl.textContent = 'QuickShare (' + peerId.substring(0, 6) + '...)';
    renderQrCode();

    deviceIdEl.addEventListener('click', () => {
      navigator.clipboard.writeText(peerId).then(() => {
        deviceIdEl.style.background = 'rgba(76,201,240,0.08)';
        setTimeout(() => deviceIdEl.style.background = 'rgba(12, 17, 25, 0.9)', 400);
      }).catch(() => alert('Copy manually: ' + peerId));
    });

    function renderQrCode() {
      const qr = qrcode(0, 'M');
      qr.addData(peerId);
      qr.make();
      qrImage.src = qr.createDataURL(6, 0);
    }

    function toggleQrPanel(visible) {
      qrPanel.classList.toggle('hidden', !visible);
      if (!visible && cameraStream) stopCameraScanner();
    }

    function startCameraScanner() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Camera access is not supported on this device/browser.');
        return;
      }

      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      }).then((stream) => {
        cameraStream = stream;
        qrVideo.srcObject = stream;
        cameraPanel.classList.remove('hidden');
        qrVideo.play().catch(() => {});
        scanQrFromCamera();
      }).catch(() => {
        alert('Unable to access the camera. Please allow camera permission and try again.');
      });
    }

    function stopCameraScanner() {
      if (qrScannerTimer) {
        clearInterval(qrScannerTimer);
        qrScannerTimer = null;
      }
      if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }
      cameraPanel.classList.add('hidden');
      if (qrVideo) qrVideo.srcObject = null;
    }

    function scanQrFromCamera() {
      const context = qrCanvas.getContext('2d', { willReadFrequently: true });

      qrScannerTimer = setInterval(() => {
        const video = qrVideo;
        if (!video || video.readyState < 2 || !cameraStream) return;

        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) return;

        qrCanvas.width = width;
        qrCanvas.height = height;
        context.drawImage(video, 0, 0, width, height);

        const imageData = context.getImageData(0, 0, width, height);
        const code = jsQR(imageData.data, width, height, {
          inversionAttempts: 'dontInvert'
        });

        if (!code) return;

        const value = String(code.data || '').trim();
        if (!value) return;

        stopCameraScanner();
        remoteIdInput.value = value;
        if (value === peerId) {
          alert('You cannot connect to yourself.');
          return;
        }
        connectToPeer(value);
      }, 250);
    }

    function setConnectionState(connected) {
      const statusText = connected ? 'Connected' : 'Waiting to connect...';
      connectionStatus.classList.toggle('disconnected', !connected);
      connectionStatus.innerHTML = '<span class="status-dot"></span><span>' + statusText + '</span>';

      connectionPill.textContent = connected ? 'Online' : 'Offline';
      connectionPill.classList.toggle('disconnected', !connected);
      disconnectContainer.classList.toggle('hidden', !connected);

      if (!connected) {
        sendProgress.classList.add('hidden');
        sendFooter.classList.add('hidden');
      }
    }

    function initPeer() {
      peer = new Peer(peerId, { debug: 0 });

      peer.on('open', (id) => {
        console.log('Peer ready, ID:', id);
        deviceIdEl.textContent = id;
      });

      peer.on('connection', (conn) => {
        if (currentConnection) {
          conn.on('open', () => conn.send({ type: 'busy' }));
          setTimeout(() => conn.close(), 500);
          return;
        }
        incomingConn = conn;
        incomingPeerName.textContent = conn.peer.substring(0, 10) + '...';
        incomingRequest.classList.remove('hidden');
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        setConnectionState(false);
        connectionStatus.querySelector('span:last-child').textContent = 'Error: ' + err.type;
      });
    }

    function setupConnection(conn) {
      currentConnection = conn;
      incomingRequest.classList.add('hidden');
      setConnectionState(true);

      conn.on('data', (data) => handleIncomingData(data));
      conn.on('close', () => {
        if (currentConnection === conn) {
          currentConnection = null;
          setConnectionState(false);
          selectedFiles = [];
          renderSendFiles();
        }
      });

      conn.on('error', (err) => {
        console.error('Connection error:', err);
      });
    }

    function connectToPeer(remoteId) {
      if (!peer || peer.destroyed) return;
      if (currentConnection) {
        currentConnection.close();
      }

      const conn = peer.connect(remoteId, {
        reliable: true,
        ordered: true,
        metadata: { app: 'quickshare' }
      });

      conn.on('open', () => setupConnection(conn));
      conn.on('error', (err) => {
        alert('Connection failed: ' + err);
        setConnectionState(false);
      });
    }

    function acceptIncoming() {
      if (!incomingConn) return;
      setupConnection(incomingConn);
      incomingConn = null;
    }

    function denyIncoming() {
      if (incomingConn) {
        incomingConn.on('open', () => incomingConn.send({ type: 'denied' }));
        setTimeout(() => incomingConn.close(), 500);
        incomingConn = null;
      }
      incomingRequest.classList.add('hidden');
    }

    function disconnect() {
      if (currentConnection) {
        currentConnection.close();
        currentConnection = null;
      }
      setConnectionState(false);
      selectedFiles = [];
      renderSendFiles();
    }

    function waitForDrain(conn) {
      return new Promise((resolve) => {
        const check = () => {
          if (!conn || conn.bufferedAmount === undefined || conn.bufferedAmount <= MAX_BUFFERED_BYTES) {
            resolve();
            return;
          }
          setTimeout(check, 25);
        };
        check();
      });
    }

    async function sendSingleFile(file) {
      if (!currentConnection) return;

      const buffer = await file.arrayBuffer();
      const totalChunks = Math.ceil(buffer.byteLength / SAFE_CHUNK_SIZE);
      const fileId = Date.now() + '-' + Math.random().toString(16).slice(2) + '-' + file.name;

      currentConnection.send({
        type: 'file-start',
        fileId,
        name: file.name,
        size: file.size,
        totalChunks
      });

      for (let i = 0; i < totalChunks; i++) {
        await waitForDrain(currentConnection);
        const chunk = buffer.slice(i * SAFE_CHUNK_SIZE, (i + 1) * SAFE_CHUNK_SIZE);
        currentConnection.send({
          type: 'file-chunk',
          fileId,
          chunkIndex: i,
          data: chunk
        });
      }

      currentConnection.send({ type: 'file-end', fileId });
    }

    async function sendFiles() {
      if (!currentConnection || selectedFiles.length === 0) return;

      sendProgress.classList.remove('hidden');
      sendProgress.textContent = 'Preparing...';

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        sendProgress.textContent = `Sending ${file.name} (${formatSize(file.size)})...`;
        await sendSingleFile(file);
      }

      sendProgress.textContent = 'All files sent!';
      setTimeout(() => {
        sendProgress.classList.add('hidden');
        selectedFiles = [];
        renderSendFiles();
      }, 1200);
    }

    function sendTextMessage(text) {
      if (!currentConnection || !text.trim()) return;
      currentConnection.send({ type: 'text', text: text.trim() });
    }

    const incomingFiles = new Map();

    function handleIncomingData(data) {
      if (!data || !data.type) return;

      switch (data.type) {
        case 'file-start':
          incomingFiles.set(data.fileId, {
            name: data.name,
            size: data.size,
            chunks: new Array(data.totalChunks),
            totalChunks: data.totalChunks,
            receivedChunks: 0
          });
          receiveStatus.classList.remove('hidden');
          receiveStatus.textContent = `Receiving ${data.name}...`;
          break;

        case 'file-chunk': {
          const fileInfo = incomingFiles.get(data.fileId);
          if (!fileInfo) return;
          fileInfo.chunks[data.chunkIndex] = new Uint8Array(data.data);
          fileInfo.receivedChunks++;
          const progress = Math.round((fileInfo.receivedChunks / fileInfo.totalChunks) * 100);
          receiveStatus.textContent = `Receiving ${fileInfo.name} (${progress}%)`;
          break;
        }

        case 'file-end': {
          const completeFile = incomingFiles.get(data.fileId);
          if (!completeFile) return;

          const blob = new Blob(completeFile.chunks, { type: 'application/octet-stream' });
          const fileName = completeFile.name;
          const fileSize = completeFile.size;

          receivedItems.push({ type: 'file', name: fileName, size: fileSize, blob });
          incomingFiles.delete(data.fileId);
          receiveStatus.textContent = `Received ${fileName}`;
          renderReceivedItems();
          saveFile(blob, fileName);
          break;
        }

        case 'text':
          receivedItems.push({ type: 'text', text: data.text });
          renderReceivedItems();
          receiveStatus.classList.remove('hidden');
          receiveStatus.textContent = 'Text message received';
          setTimeout(() => receiveStatus.classList.add('hidden'), 2000);
          break;

        case 'busy':
          alert('Peer is already connected to someone else.');
          break;

        case 'denied':
          alert('Connection denied by peer.');
          break;

        default:
          break;
      }
    }

    function saveFile(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function renderSendFiles() {
      sendFileList.innerHTML = '';

      if (selectedFiles.length === 0) {
        sendFileList.classList.add('empty');
        sendFileList.textContent = 'No files selected';
        sendFooter.classList.add('hidden');
        return;
      }

      sendFileList.classList.remove('empty');
      selectedFiles.forEach((file, idx) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <div class="file-main">
            <div class="file-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5A2.5 2.5 0 0 0 3.5 6v12A2.5 2.5 0 0 0 6 20.5h12A2.5 2.5 0 0 0 20.5 18V7.75A2.75 2.75 0 0 0 17.75 5H14l-1.5-1.5A2 2 0 0 0 10.8 3H6zm0 1.5h4.8a.5.5 0 0 1 .35.15L12.42 7H17.75A1.25 1.25 0 0 1 19 8.25V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
            </div>
            <div class="file-info">
              <span class="file-name">${escapeHtml(file.name)}</span>
              <span class="file-size">${formatSize(file.size)}</span>
            </div>
          </div>
          <button class="remove-btn" data-index="${idx}" aria-label="Remove file">×</button>
        `;
        sendFileList.appendChild(item);
      });

      sendFooter.classList.remove('hidden');

      document.querySelectorAll('.remove-btn').forEach((button) => {
        button.addEventListener('click', (event) => {
          const index = parseInt(event.target.dataset.index, 10);
          selectedFiles.splice(index, 1);
          renderSendFiles();
        });
      });
    }

    function renderReceivedItems() {
      receiveList.innerHTML = '';

      if (receivedItems.length === 0) {
        receiveList.classList.add('empty');
        receiveList.textContent = 'No items received yet';
        return;
      }

      receiveList.classList.remove('empty');
      receivedItems.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'received-item';

        if (item.type === 'file') {
          div.innerHTML = `
            <div class="file-main">
              <div class="file-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5A2.5 2.5 0 0 0 3.5 6v12A2.5 2.5 0 0 0 6 20.5h12A2.5 2.5 0 0 0 20.5 18V7.75A2.75 2.75 0 0 0 17.75 5H14l-1.5-1.5A2 2 0 0 0 10.8 3H6zm0 1.5h4.8a.5.5 0 0 1 .35.15L12.42 7H17.75A1.25 1.25 0 0 1 19 8.25V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
              </div>
              <div class="file-info">
                <span class="file-name">${escapeHtml(item.name)}</span>
                <span class="file-size">${formatSize(item.size)}</span>
              </div>
            </div>
            <span style="color:#2fd38b; font-size:0.76rem; font-weight:700;">Saved</span>
          `;
        } else if (item.type === 'text') {
          div.innerHTML = `
            <div class="file-main">
              <div class="file-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5A2.5 2.5 0 0 0 3.5 6v12A2.5 2.5 0 0 0 6 20.5h12A2.5 2.5 0 0 0 20.5 18V6A2.5 2.5 0 0 0 18 3.5H6zm0 1.5h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 3.5a.75.75 0 0 1 0-1.5h8a.75.75 0 0 1 0 1.5H8zm0 4a.75.75 0 0 1 0-1.5h8a.75.75 0 0 1 0 1.5H8zm0 4a.75.75 0 0 1 0-1.5h5a.75.75 0 0 1 0 1.5H8z"/></svg>
              </div>
              <div class="file-info">
                <span class="file-name">${escapeHtml(item.text)}</span>
              </div>
            </div>
            <span class="copy-text" data-text="${escapeHtml(item.text)}">Copy</span>
          `;
        }

        receiveList.appendChild(div);
      });

      document.querySelectorAll('.copy-text').forEach((el) => {
        el.addEventListener('click', (event) => {
          const text = event.target.dataset.text;
          navigator.clipboard.writeText(text).then(() => {
            event.target.textContent = 'Copied!';
            setTimeout(() => event.target.textContent = 'Copy', 1500);
          });
        });
      });
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;

        if (activeTab === 'send') {
          sendPanel.classList.remove('hidden');
          receivePanel.classList.add('hidden');
          sendFooter.classList.toggle('hidden', selectedFiles.length === 0);
        } else {
          sendPanel.classList.add('hidden');
          receivePanel.classList.remove('hidden');
          sendFooter.classList.add('hidden');
          sendProgress.classList.add('hidden');
        }
      });
    });

    selectFilesBtn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.onchange = (event) => {
        const files = Array.from(event.target.files);
        files.forEach((file) => {
          selectedFiles.push({
            name: file.name,
            size: file.size,
            fileObj: file
          });
        });
        renderSendFiles();
      };
      input.click();
    });

    sendTextBtn.addEventListener('click', () => {
      const text = prompt('Enter text message:');
      if (text && text.trim()) {
        sendTextMessage(text.trim());
      }
    });

    sendFilesBtn.addEventListener('click', () => sendFiles());

    showQrBtn.addEventListener('click', () => {
      toggleQrPanel(true);
      stopCameraScanner();
    });

    scanQrBtn.addEventListener('click', () => {
      toggleQrPanel(false);
      startCameraScanner();
    });

    closeCameraBtn.addEventListener('click', stopCameraScanner);

    connectBtn.addEventListener('click', () => {
      const remoteId = remoteIdInput.value.trim();
      if (!remoteId) return alert('Enter a peer ID');
      if (remoteId === peerId) return alert('Cannot connect to yourself');
      connectToPeer(remoteId);
    });

    acceptBtn.addEventListener('click', acceptIncoming);
    denyBtn.addEventListener('click', denyIncoming);
    disconnectBtn.addEventListener('click', disconnect);

    renderSendFiles();
    renderReceivedItems();
    setConnectionState(false);
    initPeer();

    window.addEventListener('beforeunload', () => {
      stopCameraScanner();
      if (currentConnection) currentConnection.close();
      if (peer) peer.destroy();
    });
  })();
</script>
</body>
</html>
